name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mali_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d mali_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mali_test
      DIRECT_URL: postgresql://test:test@localhost:5432/mali_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: test-secret-for-ci-minimum-32-chars
      AUTH_MODE: mock
      NEXT_PUBLIC_MOCK_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci --runInBand
      - name: PostgreSQL integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/mali_test
      - name: Catalogue and checkout regressions
        run: npm run verify:catalog && npm run verify:storefront && npm run verify:dropshipping
      - name: Build demo for browser tests
        run: npm run build
        env:
          NEXT_PUBLIC_MOCK_MODE: 'true'
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
        env:
          NEXT_PUBLIC_MOCK_MODE: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
