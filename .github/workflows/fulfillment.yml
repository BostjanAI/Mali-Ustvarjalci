name: Fulfillment worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: fulfillment-worker
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ secrets.FULFILLMENT_ENDPOINT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Process due fulfilments
        if: env.WORKER_URL != ''
        run: curl --fail --silent --show-error --max-time 120 -X POST -H "x-cron-secret: $CRON_SECRET" "$WORKER_URL"
      - name: Configuration pending
        if: env.WORKER_URL == ''
        run: echo "Configure FULFILLMENT_ENDPOINT_URL and CRON_SECRET to activate the worker."
