name: Supplier Sync (every 15 minutes)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: supplier-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ secrets.SYNC_ENDPOINT_URL }}
      STAGING_URL: ${{ secrets.STAGING_SYNC_ENDPOINT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      STAGING_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
    steps:
      - name: Sync production
        if: env.PROD_URL != ''
        run: curl --fail --silent --show-error -X POST -H "x-cron-secret: $CRON_SECRET" "$PROD_URL"
      - name: Sync staging
        if: env.STAGING_URL != ''
        run: curl --fail --silent --show-error -X POST -H "x-cron-secret: ${STAGING_SECRET:-$CRON_SECRET}" "$STAGING_URL"
