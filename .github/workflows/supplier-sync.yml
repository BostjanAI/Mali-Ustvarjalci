name: Supplier Sync (daily)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call production sync endpoint
        run: |
          curl -sSf -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SYNC_ENDPOINT_URL }}"
      - name: Call staging sync endpoint (optional)
        if: ${{ secrets.STAGING_SYNC_ENDPOINT_URL != '' }}
        run: |
          curl -sSf -X POST \
            -H "x-cron-secret: ${{ secrets.STAGING_CRON_SECRET || secrets.CRON_SECRET }}" \
            "${{ secrets.STAGING_SYNC_ENDPOINT_URL }}"

